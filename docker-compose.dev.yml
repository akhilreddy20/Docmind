# Infrastructure only, for running the API/worker/web locally with `npm run dev`.
name: documind-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: documind, POSTGRES_PASSWORD: documind, POSTGRES_DB: documind }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis/redis-stack-server:7.4.0-v1
    ports: ["6379:6379"]
volumes:
  pgdata:
